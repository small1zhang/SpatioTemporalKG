[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stk"
version = "0.0.1"
description = "SpatioTemporalKG: 时空动态知识图谱（基于 CARLA 0.9.16 与 Neo4j）"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Knowledge Graph Team"}]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.5",
    "neo4j>=5.14",
    "networkx>=3.2",
    "numpy>=1.25",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "typer>=0.9",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.12",
    "isort>=5.13",
    "flake8>=7.0",
    "mypy>=1.8",
    "pre-commit>=3.6",
]
storage = ["neo4j>=5.14"]
extraction = ["pandas>=2.1", "pyarrow>=14.0"]

[project.scripts]
stk = "stk.cli:app"

[tool.setuptools.packages.find]
include = ["stk*"]
exclude = ["tests*", "scripts*", "notebooks*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = ["slow: marks tests as slow", "integration: marks integration tests requiring CARLA or Neo4j"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
