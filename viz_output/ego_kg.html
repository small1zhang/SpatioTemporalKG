<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ego-Centric KG - 自车知识图谱</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;--text:#e0e0e0;--text2:#8b8fa3;--accent:#6366f1;--green:#22c55e;--ego:#f97316;--red:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter','Segoe UI',sans-serif;display:flex;flex-direction:column;height:100vh}
.header{background:linear-gradient(135deg,#1e1b4b,#312e81);padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:20px;font-weight:700}
.header .sub{color:var(--text2);font-size:12px;margin-top:2px}
.controls{display:flex;gap:8px;align-items:center;padding:10px 24px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap}
.controls label{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px;cursor:pointer}
.controls input[type=checkbox]{accent-color:var(--accent)}
select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:12px}
button{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:hover{opacity:.9}
.main{display:flex;flex:1;overflow:hidden}
.graph-area{flex:1;position:relative;overflow:hidden}
.sidebar{width:260px;background:var(--card);border-left:1px solid var(--border);padding:14px;overflow-y:auto;font-size:12px}
.sidebar h4{font-size:13px;color:var(--accent);margin:10px 0 6px;border-bottom:1px solid var(--border);padding-bottom:4px}
.sidebar h4:first-child{margin-top:0}
.prop{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid var(--border)}
.prop .k{color:var(--text2)}.prop .v{color:var(--text);font-weight:500;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.stat{color:var(--text2);font-size:11px;margin:2px 0}
.node-badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600;color:#fff}
.edge-item{padding:3px 0;border-bottom:1px solid var(--border);font-size:11px}
.edge-type{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600;margin-right:4px;color:#fff}
#graph-svg{width:100%;height:100%}
.loading{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text2)}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>🚗 Ego-Centric Knowledge Graph</h1>
    <div class="sub">仅显示自车节点及其 n跳邻居 · 简约聚焦</div>
  </div>
  <div>
    <label style="color:var(--text2);font-size:12px">分片
      <select id="shard-select" onchange="loadEgoGraph()"></select>
    </label>
  </div>
</div>

<div class="controls">
  <label><input type="checkbox" id="chk-hop2" onchange="rebuildEgo()"> 显示 2跳邻居</label>
  <label><input type="checkbox" id="chk-noise" onchange="rebuildEgo()"> 显示 Interaction/Role 噪音节点</label>
  <label><input type="checkbox" id="chk-rels" checked onchange="rebuildEgo()"> 显示关系标签</label>
  <button class="primary" onclick="rebuildEgo()">⟳ 刷新视图</button>
  <button onclick="resetView()">↺ 重置</button>
  <span id="graph-info" style="color:var(--text2);font-size:12px;margin-left:auto"></span>
</div>

<div class="main">
  <div class="graph-area" id="graph-area">
    <div class="loading" id="loading">加载中...</div>
  </div>
  <div class="sidebar" id="sidebar">
    <h4>📋 自车信息</h4>
    <div id="ego-info" style="color:var(--text2)">请加载分片</div>
    <h4>🔗 关联边 (1跳)</h4>
    <div id="ego-edges"></div>
    <h4 style="margin-top:12px">🎨 图例</h4>
    <div id="ego-legend"></div>
  </div>
</div>

<script>
const TYPE_COLORS={Vehicle:'#3b82f6',TrafficLight:'#ef4444',RoadElement:'#6b7280',EnvironmentSnapshot:'#22c55e',
  Maneuver:'#f59e0b',InteractionEvent:'#8b5cf6',SafetyViolation:'#ef4444',ResponsibilityAssignment:'#f97316',
  Junction:'#06b6d4',ScenarioSnapshot:'#a78bfa',Pedestrian:'#eab308',Rule:'#fbbf24',BehaviorRelation:'#ec4899'};
const EDGE_COLORS={in_lane:'#60a5fa',approaching:'#f87171',containsVehicle:'#a78bfa',containsTrafficLight:'#fb923c',
  containsRoad:'#9ca3af',hasEnvironment:'#4ade80',weather_context:'#86efac',lane_connects:'#93c5fd',
  adjacent_lane:'#bfdbfe',has_maneuver:'#fcd34d',has_interaction:'#c084fc',actor:'#e879f9',dst:'#f472b6',
  src:'#fb7185',standing_still:'#d1d5db',following:'#6ee7b7',manifestsAs:'#fbbf24',in_junction:'#c4b5fd',
  violates:'#ef4444',responsibleFor:'#f97316',opposite_direction:'#fb7185',ahead_of:'#60a5fa',
  overtaking:'#a78bfa',changing_lane:'#c4b5fd',yielding_to:'#86efac',approaching_pedestrian:'#f87171',
  nearby_pedestrian:'#fbbf24',blocked_view:'#9333ea',beside:'#6b7280',definedBy:'#94a3b8',supportedByEvidence:'#94a3b8'};

// 噪音类型 (隐藏后聚焦骨架)
const NOISE_TYPES=new Set(['InteractionEvent','ResponsibilityAssignment','BehaviorRelation','EnvironmentSnapshot','ScenarioSnapshot']);

let KGS={summary:null,shards:{}};
let sim=null, svgG=null, svgEl=null;
let currentData={nodes:[],edges:[]};

(async function init(){
  try{
    const r=await fetch('phase5_kg_summary.json');
    KGS.summary=await r.json();
    fillShardSelect();
    loadEgoGraph();
  }catch(e){
    document.getElementById('loading').textContent='❌ 未找到 phase5_kg_summary.json';
  }
})();

function fillShardSelect(){
  const sel=document.getElementById('shard-select');
  KGS.summary.shards.forEach(sh=>{
    const o=document.createElement('option');
    o.value=sh.shard_idx;
    o.textContent=`分片 ${sh.shard_idx}  (frames ${sh.frame_start}-${sh.frame_end})`;
    sel.appendChild(o);
  });
}

async function loadEgoGraph(){
  const sel=document.getElementById('shard-select');
  if(!sel.value) return;
  const shardIdx=parseInt(sel.value);
  const shardInfo=KGS.summary.shards.find(s=>s.shard_idx===shardIdx);
  if(!shardInfo) return;

  document.getElementById('loading').textContent='⏳ 加载分片...';
  document.getElementById('loading').style.display='flex';
  document.getElementById('graph-area').querySelector('svg')?.remove();

  if(!KGS.shards[shardIdx]){
    const fname=`graph_${String(shardIdx).padStart(4,'0')}_${shardInfo.frame_start}_${shardInfo.frame_end}.json`;
    const r=await fetch(fname);
    KGS.shards[shardIdx]=await r.json();
  }
  rebuildEgo();
}

function rebuildEgo(){
  const sel=document.getElementById('shard-select');
  if(!sel.value) return;
  const shardIdx=parseInt(sel.value);
  const g=KGS.shards[shardIdx];
  if(!g){document.getElementById('loading').textContent='❌ 无数据';return}

  const show2hop=document.getElementById('chk-hop2').checked;
  const showNoise=document.getElementById('chk-noise').checked;
  const showLabels=document.getElementById('chk-rels').checked;

  // 1. 找自车
  const ego=g.nodes.find(n=>n.type==='Vehicle' && (n.attrs||{}).is_ego);
  if(!ego){document.getElementById('loading').textContent='❌ 自车未找到';return}
  const eid=ego.id;

  // 2. 找1跳邻居 (含边类型过滤)
  const hop1Edges=g.edges.filter(e=>e.src_id===eid||e.dst_id===eid);
  const hop1Ids=new Set();
  for(const e of hop1Edges){
    const nb=e.src_id===eid?e.dst_id:e.src_id;
    if(showNoise || !NOISE_TYPES.has((g.nodes.find(n=>n.id===nb)||{}).type||'')) hop1Ids.add(nb);
  }
  hop1Ids.add(eid); // 包含自车

  // 3. 如果选2跳, 扩展到2跳
  if(show2hop){
    for(const e of g.edges){
      if(hop1Ids.has(e.src_id) && !hop1Ids.has(e.dst_id)){
        const nbNode=g.nodes.find(n=>n.id===e.dst_id);
        if(nbNode && (showNoise || !NOISE_TYPES.has(nbNode.type))) hop1Ids.add(e.dst_id);
      }
      if(hop1Ids.has(e.dst_id) && !hop1Ids.has(e.src_id)){
        const nbNode=g.nodes.find(n=>n.id===e.src_id);
        if(nbNode && (showNoise || !NOISE_TYPES.has(nbNode.type))) hop1Ids.add(e.src_id);
      }
    }
  }

  // 4. 提取可见子图
  const visNodesSet=new Set(hop1Ids);
  const visNodes=g.nodes.filter(n=>visNodesSet.has(n.id));
  const visEdges=g.edges.filter(e=>visNodesSet.has(e.src_id)&&visNodesSet.has(e.dst_id));

  // 排序: 自车第一
  visNodes.sort((a,b)=>a.id===eid?-1:b.id===eid?1:0);

  currentData={nodes:visNodes,edges:visEdges,egoId:eid};

  // 5. 渲染
  renderGraph(visNodes,visEdges,eid,showLabels);
  updateSidebar(visNodes,visEdges,eid);

  document.getElementById('loading').style.display='none';
  document.getElementById('graph-info').textContent=`节点: ${visNodes.length} | 边: ${visEdges.length} | 自车 ID: ${eid} (共 1 辆)`;
}

// ─── D3 渲染 ───
function renderGraph(nodes,edges,egoId,showLabels){
  const container=document.getElementById('graph-area');
  // 清除旧 svg
  container.querySelector('svg')?.remove();

  const W=container.clientWidth||900, H=container.clientHeight||600;
  const svg=d3.select(container).append('svg').attr('width',W).attr('height',H).attr('id','graph-svg');
  svgEl=svg;
  const g=svg.append('g');
  svgG=g;
  svg.call(d3.zoom().scaleExtent([.1,20]).on('zoom',e=>g.attr('transform',e.transform)));

  // 网格
  const gg=g.append('g');
  for(let x=-W;x<W*2;x+=80)gg.append('line').attr('x1',x).attr('y1',-H).attr('x2',x).attr('y2',H*2).attr('stroke','#1a1d27').attr('stroke-width',.5);
  for(let y=-H;y<H*2;y+=80)gg.append('line').attr('x1',-W).attr('y1',y).attr('x2',W*2).attr('y2',y).attr('stroke','#1a1d27').attr('stroke-width',.5);

  // 力模拟数据
  const simNodes=nodes.map(n=>({...n,x:W/2+(Math.random()-0.5)*200,y:H/2+(Math.random()-0.5)*200}));
  const nodeMap={};simNodes.forEach(n=>nodeMap[n.id]=n);
  const simEdges=edges.filter(e=>nodeMap[e.src_id]&&nodeMap[e.dst_id]).map(e=>({...e,source:e.src_id,target:e.dst_id}));

  // 箭头
  const defs=svg.append('defs');
  const ets=new Set(simEdges.map(e=>e.type));
  ets.forEach(t=>{
    const c=EDGE_COLORS[t]||'#4b5563';
    defs.append('marker').attr('id','a-'+t).attr('viewBox','0 -4 8 8').attr('refX',22).attr('refY',0)
      .attr('markerWidth',5).attr('markerHeight',5).attr('orient','auto')
      .append('path').attr('d','M0,-3L8,0L0,3').attr('fill',c);
  });

  // 边
  const link=g.append('g').selectAll('line').data(simEdges).join('line')
    .attr('stroke',d=>EDGE_COLORS[d.type]||'#4b5563').attr('stroke-width',1.2)
    .attr('stroke-opacity',.5).attr('marker-end',d=>'url(#a-'+d.type+')');

  // 边标签
  const edgeLabel=g.append('g').selectAll('text').data(simEdges).join('text')
    .attr('font-size',6).attr('fill',d=>EDGE_COLORS[d.type]||'#4b5563').attr('text-anchor','middle').attr('dy',-4)
    .attr('opacity',showLabels?.6:0).text(d=>d.type);

  // 节点
  const node=g.append('g').selectAll('g').data(simNodes).join('g')
    .call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y})
      .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));

  node.append('circle')
    .attr('r',d=>{
      if(d.id===egoId)return 14;
      switch(d.type){case 'Vehicle':return 9;case 'TrafficLight':return 6;case 'RoadElement':return 4;
        case 'Junction':return 6;case 'Maneuver':return 7;case 'Pedestrian':return 6;
        case 'SafetyViolation':return 8;case 'ResponsibilityAssignment':return 8;default:return 5}
    })
    .attr('fill',d=>d.id===egoId?'var(--ego)':(TYPE_COLORS[d.type]||'#6b7280'))
    .attr('stroke',d=>{
      if(d.id===egoId)return '#fff';
      if(d.attrs?.is_ego)return '#fbbf24';
      return '#0f1117'
    })
    .attr('stroke-width',d=>d.id===egoId?3:1.5)
    .style('cursor','pointer')
    .on('click',(e,d)=>showNodeDetail(d,simEdges))
    .on('mouseover',function(e,d){
      d3.select(this).transition().duration(150).attr('r',d=>d.id===egoId?18:(d.type==='Vehicle'?13:10));
      link.attr('stroke-opacity',l=>(l.src_id===d.id||l.dst_id===d.id)?.8:.08);
      link.attr('stroke-width',l=>(l.src_id===d.id||l.dst_id===d.id)?2.5:.3);
      edgeLabel.attr('opacity',l=>(l.src_id===d.id||l.dst_id===d.id)?.8:0);
      node.attr('opacity',n2=>{
        if(n2.id===d.id)return 1;
        if(simEdges.some(e=>(e.src_id===d.id&&e.dst_id===n2.id)||(e.dst_id===d.id&&e.src_id===n2.id)))return 1;
        return .12;
      });
    })
    .on('mouseout',function(){
      link.attr('stroke-opacity',.5).attr('stroke-width',1.2);
      edgeLabel.attr('opacity',showLabels?.6:0);
      node.attr('opacity',1);
    });

  // 标签
  node.append('text')
    .attr('dy',d=>{
      const r=d.id===egoId?14:(d.type==='Vehicle'?9:5);
      return -r-4;
    })
    .attr('text-anchor','middle').attr('font-size',d=>d.id===egoId?11:(d.type==='Vehicle'?9:7))
    .attr('font-weight',600).attr('fill','#e0e0e0')
    .attr('paint-order','stroke').attr('stroke','#0f1117').attr('stroke-width',2.5)
    .text(d=>{
      if(d.id===egoId)return '🚗 EGO '+(d.attrs?.vehicle_type||'').split('.').pop();
      if(d.type==='Vehicle')return '🚗 '+(d.attrs?.vehicle_type||'').split('.').pop()||d.id;
      if(d.type==='Pedestrian')return '🚶'+d.id;
      if(d.type==='TrafficLight')return '🚦'+(d.attrs?.state||'').replace('TrafficLightState.','').slice(0,3);
      if(d.type==='RoadElement')return 'L'+d.attrs?.lane_id;
      if(d.type==='Maneuver')return '🎯'+(d.attrs?.labels||[]).join(',').slice(0,12);
      if(d.type==='SafetyViolation')return '⚠'+(d.attrs?.rule_code||'').slice(0,8);
      if(d.type==='Junction')return '🚧J'+((d.attrs?.junction_id||'').toString().slice(0,4));
      if(d.type==='InteractionEvent')return '⚡';
      if(d.type==='ResponsibilityAssignment')return '⚖';
      return d.type.slice(0,5);
    });

  // 力
  sim=d3.forceSimulation(simNodes)
    .force('link',d3.forceLink(simEdges).id(d=>d.id).distance(d=>d.id===egoId?100:70).strength(d=>d.source===egoId||d.target===egoId?.4:.15))
    .force('charge',d3.forceManyBody().strength(d=>d.id===egoId?-300:-60))
    .force('center',d3.forceCenter(W/2,H/2)).force('collision',d3.forceCollide(d=>d.id===egoId?20:8))
    .force('x',d3.forceX(W/2).strength(.02)).force('y',d3.forceY(H/2).strength(.02));

  sim.on('tick',()=>{
    link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    edgeLabel.attr('x',d=>(d.source.x+d.target.x)/2).attr('y',d=>(d.source.y+d.target.y)/2);
    node.attr('transform',d=>`translate(${d.x},${d.y})`);
  });
}

function showNodeDetail(n,edges){
  const a=n.attrs||{};
  const sid=document.getElementById('sidebar');
  let html=`<div style="margin-bottom:6px"><span class="node-badge" style="background:${TYPE_COLORS[n.type]||'#6b7280'}">${n.type}</span>`;
  if(n.id===currentData.egoId) html+=` <span class="node-badge" style="background:var(--ego)">🏠 EGO</span>`;
  html+=`</div>`;
  html+=`<div class="prop"><span class="k">ID</span><span class="v">${n.id}</span></div>`;
  html+=`<div class="prop"><span class="k">帧范围</span><span class="v">${n.first_frame}~${n.last_frame}</span></div>`;
  const skip=new Set(['entity_id','entity_type','first_frame','last_frame']);
  for(const[k,v]of Object.entries(a)){
    if(skip.has(k)||v===null||v===undefined)continue;
    const vs=typeof v==='number'?v.toFixed?.(2)??v:String(v);
    html+=`<div class="prop"><span class="k">${k}</span><span class="v" title="${vs}">${vs}</span></div>`;
  }
  document.getElementById('ego-info').innerHTML=html;

  // 关联边
  const conn=edges.filter(e=>e.src_id===n.id||e.dst_id===n.id);
  const grouped={};
  conn.forEach(e=>{if(!grouped[e.type])grouped[e.type]=[];grouped[e.type].push(e)});
  document.getElementById('ego-edges').innerHTML=Object.entries(grouped).map(([t,es])=>{
    const c=EDGE_COLORS[t]||'#4b5563';
    return es.slice(0,6).map(e=>{
      const other=e.src_id===n.id?e.dst_id:e.src_id;
      const dir=e.src_id===n.id?'→':'←';
      return `<div class="edge-item"><span class="edge-type" style="background:${c}">${t}</span>${dir} <b>${other}</b></div>`;
    }).join('')+(es.length>6?`<div class="stat">...还有 ${es.length-6} 条</div>`:'');
  }).join('');
}

function updateSidebar(nodes,edges,egoId){
  // 边类型分布
  const grouped={};
  edges.forEach(e=>{if(!grouped[e.type])grouped[e.type]=0;grouped[e.type]++});
  // 更新图例
  document.getElementById('ego-legend').innerHTML=Object.entries(TYPE_COLORS).filter(([t])=>nodes.some(n=>n.type===t)).map(([t,c])=>{
    const cnt=nodes.filter(n=>n.type===t).length;
    return `<div style="display:flex;align-items:center;gap:5px;margin:2px 0"><span style="width:10px;height:10px;border-radius:50%;display:inline-block;background:${t==='Vehicle'&&nodes.find(n=>n.id===egoId)?'var(--ego)':c}"></span><span style="font-size:11px;color:var(--text2)">${t} (${cnt})</span></div>`;
  }).join('');
}

function resetView(){
  if(svgEl)svgEl.call(d3.zoom().transform,d3.zoomIdentity);
}
</script>
</body>
</html>
